name: Focused iOS 26 checks and unified IPA
on:
  workflow_dispatch:
    inputs:
      runner_image:
        description: macOS pool with Xcode 26 and iOS 26 simulators
        type: choice
        default: macos-26
        options: [macos-26, macos-15]
      source_ref:
        description: Frozen source commit to verify and build
        required: true
        type: string
      build_only:
        description: Build IPA without rerunning the selected UI checks
        type: boolean
        default: false
      test_identifiers:
        description: Comma-separated XCTest identifiers to recheck
        required: true
        type: string
permissions:
  contents: read
jobs:
  recover:
    name: iOS 26 targeted recheck and unified IPA
    runs-on: ${{ inputs.runner_image || 'macos-26' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          git rev-parse HEAD
      - name: Recheck the selected test
        if: ${{ !inputs.build_only }}
        env:
          JM_RECHECK_TESTS: ${{ inputs.test_identifiers }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a SELECTED <<< "$JM_RECHECK_TESTS"
          TEST_FLAGS=()
          for CASE in "${SELECTED[@]}"; do
            [[ "$CASE" =~ ^JMDownloader(UI)?Tests/[A-Za-z0-9_]+/[A-Za-z0-9_]+$ ]]
            TEST_FLAGS+=("-only-testing:$CASE")
          done
          [[ ${#TEST_FLAGS[@]} -gt 0 ]]
          mkdir -p build
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); names=[x for k,v in d["devices"].items() if "iOS-26" in k for x in v if x["name"]=="iPhone 17 Pro Max"]; assert names; print(names[0]["udid"])')
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          python3 -c 'import time; print(time.time())' >build/video-start.txt
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 build/NativeControls.mp4 >build/video.log 2>&1 &
          VIDEO_PID=$!
          collect_results() {
            kill -INT "$VIDEO_PID" 2>/dev/null || true
            wait "$VIDEO_PID" || true
            swift scripts/export-native-control-frames.swift build/NativeControls.mp4 build/video-start.txt build/Test.log build/control-frames || true
            xcrun xcresulttool export attachments --path build/Recheck.xcresult --output-path build/screenshots || true
          }
          trap collect_results EXIT
          xcodebuild test -project JMDownloader.xcodeproj -scheme JMDownloader \
            -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO \
            "${TEST_FLAGS[@]}" -derivedDataPath build/DerivedData \
            -resultBundlePath build/Recheck.xcresult CODE_SIGNING_ALLOWED=NO | tee build/Test.log
      - name: Build single unsigned device IPA
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM-downloader-recheck-build
          path: |
            build/JM-downloader-unsigned.ipa
            build/Recheck.xcresult
            build/screenshots
            build/NativeControls.mp4
            build/control-frames
            build/Test.log
            build/video-start.txt
          if-no-files-found: warn
          retention-days: 14
