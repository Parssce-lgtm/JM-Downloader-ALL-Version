name: Build iOS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -oq JM-downloader-source.zip
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcrun simctl list devices available
      - name: Unit and UI tests on iPhone 17 Pro Max
        run: bash scripts/test-ios.sh
      - name: Build unsigned device IPA
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM-downloader-build
          path: |
            build/JM-downloader-unsigned.ipa
            build/Tests.xcresult
            build/screenshots
          if-no-files-found: warn
          retention-days: 14
