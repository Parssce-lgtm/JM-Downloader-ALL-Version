name: Build iOS
on:
  workflow_dispatch:
    inputs:
      compatibility:
        description: Also run the iOS 16 traditional-interface representative
        type: boolean
        default: true
        required: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: iOS 26 full tests and unified IPA
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Full unit and UI tests
        run: bash scripts/test-ios.sh
      - name: Build single unsigned device IPA
        run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JM-downloader-build
          path: |
            build/JM-downloader-unsigned.ipa
            build/Tests.xcresult
            build/screenshots
          if-no-files-found: warn
          retention-days: 14
  legacy:
    if: ${{ inputs.compatibility }}
    name: iOS 16 traditional interface representative
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Apple iOS 16.4 runtime
        timeout-minutes: 15
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -downloadPlatform iOS -buildVersion 16.4
      - name: Select legacy-compatible toolchain
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Unit and interface representative tests
        env:
          JM_TEST_OS: '16'
          JM_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-XS
        run: bash scripts/test-compatibility.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-ios-16
          path: |
            build/Compatibility.xcresult
            build/screenshots
          if-no-files-found: warn
          retention-days: 14
