name: Build 1.8 iOS and Android
on:
  workflow_dispatch:
    inputs:
      ios:
        description: Build the iOS IPA too (no iOS tests)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  android:
    name: Android unit tests, lint and signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
      - name: Build and verify
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/android-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-1.8.0
          path: |
            android/app/build/outputs/apk
            android/app/build/reports
          retention-days: 14
  devices:
    name: Android ${{ matrix.api }} device checks
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 31]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Android-1.8.0
          path: android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android-build/outputs/apk/debug/app-debug.apk
            adb install android-build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r app.jmdownloader.android.test/androidx.test.runner.AndroidJUnitRunner | tee device-tests.txt
            ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' device-tests.txt
            grep -E 'OK \([0-9]+ tests?\)' device-tests.txt
            adb uninstall app.jmdownloader.android
            adb install android-build/outputs/apk/release/app-release.apk
            adb shell am start -W -n app.jmdownloader.android/.MainActivity
            sleep 3
            adb shell pidof app.jmdownloader.android
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png screen-${{ matrix.api }}.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-${{ matrix.api }}
          path: |
            device-tests.txt
            screen-*.png
  ios:
    if: ${{ inputs.ios }}
    name: iOS 1.8 unified IPA (build only)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - run: bash scripts/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-1.8.0
          path: build/JM-downloader-unsigned.ipa
          retention-days: 14
